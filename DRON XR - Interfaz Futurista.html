<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRON XR // Interfaz Futurista</title>
<style>
:root{--c1:#00f0ff;--c2:#ff2bd6;--bg:#03040d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Orbitron','Segoe UI',system-ui,sans-serif;color:var(--c1)}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.panel{position:absolute;pointer-events:auto;background:linear-gradient(135deg,rgba(0,240,255,.12),rgba(255,43,214,.08));border:1px solid rgba(0,240,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 24px rgba(0,240,255,.35),inset 0 0 18px rgba(0,240,255,.12);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#title{top:16px;left:16px;padding:12px 22px}
#title h1{margin:0;font-size:18px;letter-spacing:6px;text-shadow:0 0 12px var(--c1)}
#title small{color:var(--c2);letter-spacing:3px;font-size:10px}
#ctrl{bottom:16px;left:50%;margin-left:-150px;width:300px;padding:14px;display:flex;flex-direction:column;gap:8px;animation-delay:-1.5s}
button,label.btn{font:inherit;font-size:12px;letter-spacing:3px;color:var(--c1);background:rgba(0,240,255,.08);border:1px solid var(--c1);padding:10px;cursor:pointer;text-align:center;transition:.2s;text-transform:uppercase}
button:hover,label.btn:hover{background:var(--c1);color:#000;box-shadow:0 0 20px var(--c1)}
button.m{border-color:var(--c2);color:var(--c2)}button.m:hover{background:var(--c2);box-shadow:0 0 20px var(--c2);color:#000}
button:disabled{opacity:.35;pointer-events:none}
#tel{top:16px;right:16px;padding:12px 18px;min-width:150px;font-size:11px;letter-spacing:2px;animation-delay:-3s}
#tel div{display:flex;justify-content:space-between;gap:16px;margin:4px 0}#tel b{color:#fff}
.bar{height:5px;background:rgba(255,255,255,.12);margin-top:6px}.bar i{display:block;height:100%;width:80%;background:linear-gradient(90deg,var(--c2),var(--c1));box-shadow:0 0 8px var(--c1)}
#msg{position:absolute;bottom:230px;width:100%;text-align:center;font-size:11px;letter-spacing:3px;color:var(--c2);text-shadow:0 0 8px var(--c2)}
@media(max-width:600px){#tel{top:auto;bottom:210px;right:8px;font-size:10px;padding:8px 10px;min-width:0}#title h1{font-size:14px}}
#ui.xr{display:none}
</style>
</head>
<body>
<div id="ui">
  <div class="panel" id="title"><h1>DRON//XR</h1><small>SISTEMA DE VUELO ONLINE</small></div>
  <div class="panel" id="tel">
    <div>ALT <b id="alt">0</b>m</div><div>VEL <b id="spd">0</b>km/h</div><div>RUMBO <b id="hdg">0</b>°</div>
    <div>BATERÍA <b id="bat">100</b>%</div><div class="bar"><i id="bar"></i></div>
  </div>
  <div class="panel" id="ctrl">
    <button id="vr" disabled>Entrar a VR</button>
    <button id="ar" class="m" disabled>Entrar a AR</button>
    <label class="btn">Cargar modelo .glb<input id="file" type="file" accept=".glb,.gltf" hidden></label>
  </div>
  <div id="msg">ARRASTRÁ PARA ORBITAR · RUEDA PARA ZOOM</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x03040d);
scene.fog=new THREE.FogExp2(0x03040d,.035);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.05,200);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x88ccff,0x220033,.9));
const key=new THREE.PointLight(0x00f0ff,2,30);key.position.set(0,6,0);scene.add(key);
const mag=new THREE.PointLight(0xff2bd6,1.5,30);mag.position.set(-5,2,5);scene.add(mag);

// Entorno (se oculta en AR)
const env=new THREE.Group();scene.add(env);
const grid=new THREE.GridHelper(60,60,0x00f0ff,0x1a2a6a);grid.material.transparent=true;grid.material.opacity=.5;env.add(grid);
for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(2+i*1.6,.02,8,96),new THREE.MeshBasicMaterial({color:i%2?0xff2bd6:0x00f0ff}));r.rotation.x=Math.PI/2;r.position.y=.02+i*.01;env.add(r);}
const pg=new THREE.BufferGeometry(),pp=[];for(let i=0;i<500;i++)pp.push((Math.random()-.5)*50,Math.random()*15,(Math.random()-.5)*50);
pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
const stars=new THREE.Points(pg,new THREE.PointsMaterial({color:0x66f6ff,size:.06}));env.add(stars);

// Dron procedural
const drone=new THREE.Group();scene.add(drone);
let model=new THREE.Group();drone.add(model);
const rotors=[];
function buildDrone(){
  const g=new THREE.Group();
  const dark=new THREE.MeshStandardMaterial({color:0x151a2e,metalness:.8,roughness:.3});
  const glow=new THREE.MeshBasicMaterial({color:0x00f0ff});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.5,.14,.5),dark);g.add(body);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),new THREE.MeshBasicMaterial({color:0xff2bd6}));eye.position.set(0,-.05,.27);g.add(eye);
  [[1,1],[-1,1],[1,-1],[-1,-1]].forEach(([x,z],i)=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.7,.04,.05),dark);arm.position.set(x*.3,0,z*.3);arm.rotation.y=Math.atan2(-z,x)*1;g.add(arm);
    const motor=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.08,16),dark);motor.position.set(x*.55,.04,z*.55);g.add(motor);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.2,.012,8,32),glow);ring.rotation.x=Math.PI/2;ring.position.set(x*.55,.09,z*.55);g.add(ring);
    const rot=new THREE.Mesh(new THREE.BoxGeometry(.4,.008,.04),new THREE.MeshBasicMaterial({color:0xbffaff,transparent:true,opacity:.7}));
    rot.position.set(x*.55,.1,z*.55);g.add(rot);rotors.push(rot);
  });
  const halo=new THREE.Mesh(new THREE.ConeGeometry(.45,1.4,32,1,true),new THREE.MeshBasicMaterial({color:0x00f0ff,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false}));
  halo.position.y=-.75;g.add(halo);
  g.scale.setScalar(1.3);
  return g;
}
drone.remove(model);model=buildDrone();drone.add(model);

// HUD flotante en 3D (visible en VR/AR)
const hc=document.createElement('canvas');hc.width=512;hc.height=320;
const hx=hc.getContext('2d'),htex=new THREE.CanvasTexture(hc);
const hud=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1),new THREE.MeshBasicMaterial({map:htex,transparent:true,side:THREE.DoubleSide}));
scene.add(hud);
let T={alt:0,spd:0,hdg:0,bat:100};
function drawHud(t){
  hx.clearRect(0,0,512,320);
  hx.fillStyle='rgba(3,10,30,.55)';hx.fillRect(0,0,512,320);
  hx.strokeStyle='#00f0ff';hx.lineWidth=3;hx.shadowColor='#00f0ff';hx.shadowBlur=14;
  hx.strokeRect(6,6,500,308);
  hx.strokeStyle='#ff2bd6';hx.beginPath();hx.moveTo(6,40);hx.lineTo(120,40);hx.stroke();
  hx.shadowBlur=8;hx.fillStyle='#00f0ff';hx.font='bold 22px monospace';hx.fillText('DRON//XR  TELEMETRÍA',20,32);
  hx.font='20px monospace';
  [['ALTITUD',T.alt.toFixed(1)+' m'],['VELOCIDAD',T.spd.toFixed(0)+' km/h'],['RUMBO',T.hdg.toFixed(0)+'°'],['BATERÍA',T.bat.toFixed(0)+' %']].forEach((r,i)=>{
    hx.fillStyle='#00f0ff';hx.fillText(r[0],24,86+i*44);hx.fillStyle='#fff';hx.textAlign='right';hx.fillText(r[1],488,86+i*44);hx.textAlign='left';});
  hx.fillStyle='#ff2bd6';hx.fillRect(24,262,464*T.bat/100,10);
  hx.beginPath();hx.arc(444,50,12,0,6.28);hx.fillStyle=Math.sin(t*6)>0?'#ff2bd6':'#400a38';hx.fill();
  htex.needsUpdate=true;
}

// Cargar .glb propio
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  new THREE.GLTFLoader().load(url,gl=>{
    drone.remove(model);rotors.length=0;
    model=gl.scene;
    const box=new THREE.Box3().setFromObject(model),s=box.getSize(new THREE.Vector3());
    model.scale.setScalar(1.2/Math.max(s.x,s.y,s.z));
    const c=new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());model.position.sub(c);
    drone.add(model);$('msg').textContent='MODELO CARGADO: '+f.name.toUpperCase();
  },undefined,()=>{$('msg').textContent='ERROR AL CARGAR EL ARCHIVO';});
};

// Órbita manual
let az=.6,el=.35,dist=9,drag=false,px=0,py=0;
const cv=renderer.domElement;
cv.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY};
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-px)*.006;el=Math.max(.05,Math.min(1.4,el+(e.clientY-py)*.005));px=e.clientX;py=e.clientY});
cv.addEventListener('wheel',e=>{dist=Math.max(3,Math.min(25,dist+e.deltaY*.01))},{passive:true});

// XR
async function setupXR(){
  if(!navigator.xr){$('msg').textContent='WEBXR NO DISPONIBLE EN ESTE NAVEGADOR';return;}
  for(const [id,mode,opts] of [['vr','immersive-vr',{optionalFeatures:['local-floor']}],['ar','immersive-ar',{optionalFeatures:['local-floor']}]]){
    try{
      if(await navigator.xr.isSessionSupported(mode)){
        const b=$(id);b.disabled=false;
        b.onclick=async()=>{
          const s=await navigator.xr.requestSession(mode,opts);
          const ar=mode==='immersive-ar';
          scene.background=ar?null:new THREE.Color(0x03040d);scene.fog=ar?null:scene.fog;env.visible=!ar;
          renderer.xr.setReferenceSpaceType('local-floor');
          await renderer.xr.setSession(s);$('ui').classList.add('xr');inXR=true;
          s.addEventListener('end',()=>{inXR=false;env.visible=true;scene.background=new THREE.Color(0x03040d);scene.fog=new THREE.FogExp2(0x03040d,.035);$('ui').classList.remove('xr')});
        };
      }
    }catch(e){}
  }
}
setupXR();
let inXR=false;

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// Loop
const clock=new THREE.Clock();let last=new THREE.Vector3(),tt=0;
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime(),dt=clock.getDelta()||.016;
  const R=4;
  const x=Math.cos(t*.5)*R,z=Math.sin(t*.7)*R*.8,y=2.2+Math.sin(t*.9)*.6;
  const p=new THREE.Vector3(x,y,z);
  const v=p.clone().sub(last);last.copy(p);
  drone.position.copy(p);
  const look=new THREE.Vector3(-Math.sin(t*.5)*R*.5,0,Math.cos(t*.7)*R*.56);
  drone.rotation.y=Math.atan2(look.x,look.z);
  drone.rotation.z=-Math.sin(t*.5)*.25;drone.rotation.x=.12+Math.sin(t*.9)*.05;
  rotors.forEach((r,i)=>r.rotation.y+=(i%2?1:-1)*1.2);
  stars.rotation.y=t*.01;key.position.set(x,y+1,z);
  // HUD flotando junto al dron
  hud.position.set(x+1.3,y+1.1+Math.sin(t*2)*.05,z);
  const target=inXR?renderer.xr.getCamera(cam).position:cam.position;
  hud.lookAt(target);
  if(!inXR){
    cam.position.set(Math.sin(az)*Math.cos(el)*dist,1.5+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);
    cam.lookAt(0,2,0);
  }
  T.alt=y*3;T.spd=v.length()*60*3.6*.4;T.hdg=((drone.rotation.y*180/Math.PI)%360+360)%360;T.bat=Math.max(5,100-(t*.15)%95);
  if(Math.floor(t*10)!==tt){tt=Math.floor(t*10);
    $('alt').textContent=T.alt.toFixed(1);$('spd').textContent=T.spd.toFixed(0);$('hdg').textContent=T.hdg.toFixed(0);$('bat').textContent=T.bat.toFixed(0);$('bar').style.width=T.bat+'%';
    drawHud(t);}
  renderer.render(scene,cam);
});
</script>
</body>
</html>
